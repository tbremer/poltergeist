name: Release

# Build and publish a downloadable .app whenever a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required for `gh release create`

jobs:
  release:
    # macos-26 ships Xcode 26 (Swift 6.2+). A dependency (KeyboardShortcuts 3.0.1)
    # requires Swift tools 6.2, which macos-15 (Swift 6.1) can't load.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (Swift 6.2+)
        run: |
          # Use the image's default Xcode (26.x stable on macos-26).
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Install librsvg (icon generation)
        run: brew install librsvg

      - name: Package .app
        env:
          TAG: ${{ github.ref_name }}
        run: |
          export POLTERGEIST_VERSION="${TAG#v}" # v0.1.0 -> 0.1.0 in the bundle
          scripts/package-app.sh release

      - name: Zip bundle
        run: ditto -c -k --keepParent dist/Poltergeist.app "Poltergeist-${{ github.ref_name }}.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          Unsigned, un-notarized macOS app — requires macOS 14 (Sonoma) or later.

          **First launch is blocked by Gatekeeper.** To open:
          - Right-click (Control-click) `Poltergeist.app` -> **Open** -> **Open**, or
          - Run: `xattr -dr com.apple.quarantine Poltergeist.app`

          The OpenCode sidebar requires the `opencode` CLI on your `PATH`.
          EOF
          gh release create "$TAG" "Poltergeist-${TAG}.zip" \
            --title "Poltergeist $TAG" \
            --notes-file notes.md \
            --verify-tag
